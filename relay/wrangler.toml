# Optional: lets you deploy the relay from a computer with `npx wrangler deploy` instead of pasting code.
name = "finance-relay"
main = "worker.mjs"
compatibility_date = "2025-01-01"

[vars]
PLAID_ENV = "production"            # or "sandbox" for fake test banks
ALLOWED_ORIGIN = "https://YOUR-GITHUB-USERNAME.github.io"

[[kv_namespaces]]
binding = "TOKENS"
id = "PASTE-YOUR-KV-NAMESPACE-ID"
# Secrets are never stored here. Set them with: npx wrangler secret put PLAID_CLIENT_ID (also PLAID_SECRET, APP_KEY)
