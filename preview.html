<style>

* { box-sizing: border-box; }

main { max-width: 460px; margin: 0 auto; padding: 18px 16px 40px; }

/* App Store header */
.store-header { display: flex; align-items: center; gap: 14px; }
.store-header img { width: 64px; height: 64px; border-radius: 15px; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 6px 20px rgba(0,0,0,.5); }
.store-header h1 { font-size: 21px; margin: 0; letter-spacing: -0.3px; }

.get-button[hidden] { display: none; }

.store-facts { display: grid; grid-template-columns: repeat(4, 1fr); margin: 16px 0 6px; padding: 10px 0; border-top: 1px solid #1f2128; border-bottom: 1px solid #1f2128; text-align: center; }
.store-facts div + div { border-left: 1px solid #1f2128; }
.store-facts small { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
.store-facts b { display: block; font-size: 17px; margin: 3px 0 1px; }
.store-facts span { color: var(--muted); font-size: 11px; }

/* Caption over the phone */
.caption { text-align: center; margin: 22px 0 14px; min-height: 76px; }
.caption h2 { font-size: 26px; line-height: 1.12; letter-spacing: -0.6px; margin: 0 0 6px; }
.caption p { margin: 0 auto; color: var(--muted); font-size: 15px; max-width: 330px; }
.caption .fresh { animation: caption-in .5s cubic-bezier(.2,.8,.2,1) both; }
.caption p.fresh { animation-delay: .06s; }
@keyframes caption-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* iPhone */
.phone { --screen-width: min(300px, 76vw, calc((100svh - 300px) * 393 / 852)); width: calc(var(--screen-width) + 22px); margin: 0 auto; padding: 11px; border-radius: calc(var(--screen-width) * 0.16); position: relative;
  background: linear-gradient(150deg, #5b5e66 0%, #2a2c31 18%, #17181b 50%, #2a2c31 82%, #4c4f56 100%);
  box-shadow: 0 0 0 1px #000 inset, 0 0 0 2px #3a3c42 inset, 0 40px 90px -20px color-mix(in srgb, var(--glow, #5aa2ff) 35%, transparent), 0 20px 40px rgba(0,0,0,.6); }
.phone::before { content: ""; position: absolute; left: -3px; top: 22%; width: 3px; height: 9%; border-radius: 2px 0 0 2px; background: #3a3c42; box-shadow: 0 calc(var(--screen-width) * .24) 0 #3a3c42; }
.phone::after { content: ""; position: absolute; right: -3px; top: 28%; width: 3px; height: 13%; border-radius: 0 2px 2px 0; background: #3a3c42; }
.screen { width: var(--screen-width); aspect-ratio: 393 / 852; border-radius: calc(var(--screen-width) * 0.135); overflow: hidden; position: relative; background: var(--page); cursor: pointer; user-select: none; -webkit-user-select: none; }
.status-bar { position: absolute; inset: 0 0 auto; height: calc(var(--screen-width) * 54 / 393); z-index: 3; background: linear-gradient(var(--page) 60%, transparent); display: flex; align-items: center; justify-content: space-between; padding: calc(var(--screen-width) * 0.02) calc(var(--screen-width) * 0.085) 0; font-weight: 600; font-size: calc(var(--screen-width) * 0.043); pointer-events: none; }
.status-bar svg { height: calc(var(--screen-width) * 0.03); width: auto; margin-left: 5px; fill: var(--text); }
.island { position: absolute; z-index: 4; top: calc(var(--screen-width) * 0.028); left: 50%; transform: translateX(-50%); width: 31%; height: calc(var(--screen-width) * 0.094); background: #000; border-radius: 99px; }
.app-frames { position: absolute; inset: 0; }
.app-screen { position: absolute; top: 0; left: 0; width: 393px; height: 852px; overflow: hidden; transform-origin: 0 0; opacity: 0; transition: opacity .45s ease; pointer-events: none; background: var(--page); }
.app-screen.current { opacity: 1; }
.home-indicator { position: absolute; z-index: 3; bottom: calc(var(--screen-width) * 0.02); left: 50%; transform: translateX(-50%); width: 36%; height: 4px; border-radius: 4px; background: rgba(255,255,255,.75); pointer-events: none; }

/* Progress and controls */
.progress { display: flex; gap: 5px; max-width: 330px; margin: 18px auto 0; }
.progress button { flex: 1; height: 4px; border: 0; padding: 0; border-radius: 4px; background: #2a2c32; overflow: hidden; position: relative; cursor: pointer; }
.progress button i { position: absolute; inset: 0; background: var(--text); transform-origin: left; transform: scaleX(0); }
.progress button.done i { transform: scaleX(1); }
.progress button.on i { animation: fill-up var(--duration) linear forwards; }
.paused .progress button.on i { animation-play-state: paused; }
@keyframes fill-up { to { transform: scaleX(1); } }
.controls { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
.controls button { background: var(--tile); color: var(--text); border: 1px solid #25272e; border-radius: 99px; height: 38px; min-width: 38px; padding: 0 14px; font-size: 14px; cursor: pointer; }

/* Feature list */
.features { margin-top: 30px; display: grid; gap: 8px; }
.features h3 { font-size: 20px; margin: 0 0 4px; }
.feature { display: flex; gap: 12px; align-items: center; background: var(--tile); border-radius: 14px; padding: 12px 14px; cursor: pointer; border: 1px solid transparent; transition: border-color .2s ease, background .2s ease; }
.feature.on { border-color: color-mix(in srgb, var(--feature-color) 60%, transparent); background: color-mix(in srgb, var(--feature-color) 9%, var(--tile)); }
.feature-icon { width: 38px; height: 38px; flex: none; border-radius: 10px; display: grid; place-items: center; font-size: 19px; background: color-mix(in srgb, var(--feature-color) 20%, transparent); }
.feature b { display: block; font-size: 15px; }
.feature span { color: var(--muted); font-size: 13px; }
.fine-print { color: #555a66; font-size: 12px; text-align: center; margin-top: 22px; line-height: 1.5; }
@media (prefers-reduced-motion: reduce) { .caption .fresh { animation: none; } }
</style>

\/label>\n    <\/div>\n    <div id=\"plan-what-if-result\"><\/div>\n  <\/div>\n  <div id=\"page-car\" hidden=\"\">\n    <div id=\"car-summary\"><h2>Car loan<\/h2>\n    <div class=\"tile car-hero\"><div class=\"small\">Still owed (principal)<\/div><div class=\"huge-number\">$12,372.88<\/div>\n      <div class=\"bar goal-bar\"><div class=\"bar-fill\" style=\"width:38%\"><\/div><\/div>\n      <div class=\"small\">38% of the $20,000.00 loan paid off<\/div><\/div>\n    <div class=\"tile car-tile\"><div class=\"small\">Paid so far<\/div><div class=\"big-number\">$9,200.00<\/div>\n      <div class=\"split-bar\"><span class=\"split-loan\" style=\"width:83%\"><\/span><span class=\"split-interest\" style=\"width:17%\"><\/span><\/div>\n      <div class=\"tile-row small\"><span><span class=\"dot dot-loan\"><\/span>Went to the loan<\/span><span>$7,627.12<\/span><\/div>\n      <div class=\"tile-row small\"><span><span class=\"dot dot-interest\"><\/span>Went to interest<\/span><span>$1,572.88<\/span><\/div>\n      <div class=\"small\">23 of 57 payments made<\/div><\/div>\n    <div class=\"tile car-tile\"><div class=\"small\">Paid off on<\/div><div class=\"big-number\">Sep 2029<\/div>\n      <div class=\"small\">34 payments left of $400.00. About $900.92 interest still to come.<\/div><\/div>\n    \n    <div class=\"tile car-tile\"><b>Loan facts<\/b>\n      <div class=\"facts-grid\">\n        <div><span class=\"fact-icon\">\ud83d\ude97<\/span><b>$20,000.00<\/b><span class=\"small\">Loan amount<\/span><\/div>\n        <div><span class=\"fact-icon\">\ud83d\udcc8<\/span><b>5%<\/b><span class=\"small\">Rate<\/span><\/div>\n        <div><span class=\"fact-icon\">\ud83d\udcc5<\/span><b>57<\/b><span class=\"small\">Payments<\/span><\/div>\n        <div><span class=\"fact-icon\">\ud83d\udcb8<\/span><b>$2,473.80<\/b><span class=\"small\">Total interest<\/span><\/div>\n      <\/div><\/div><\/div>\n    <div class=\"tile planner-card\"><div class=\"planner-head\"><span class=\"planner-icon\">\u an\" class=\"\"><span class=\"menu-icon\">\ud83d\ude97<\/span>Car loan<\/button>\n    <button id=\"tab-setup\" data-title=\"Set up\" hidden=\"\"><\/button>\n    <button id=\"tab-settings\" data-title=\"Settings\"><span class=\"menu-icon\">\u2699\ufe0f<\/span>Settings<\/button>\n  <\/nav>\n\n  \n  \n  \n  \n  \n  \n  \n  \n  \n  \n  \n  \n  \n\n\n"};
// Plays one real app screen inside a sealed box (shadow DOM) on this page, plus a short scripted demo on it.
// APP_CSS and SCENE_HTML are filled in by the build step: the app's real stylesheet and each captured screen.

const APP_WIDTH = 393, APP_HEIGHT = 852;

// The app's stylesheet is written for a whole page; inside the box, the page is .app-body and :root is the box.
function stylesForBox(appCss) {
  return appCss
    .replace(/:root\b/g, ":host")
    .replace(/(^|[\s,}])html,\s*body\b/g, "$1.app-scroll, .app-body")
    .replace(/(^|[\s,}])body(?=[\s,{.:#[])/g, "$1.app-body");
}

const DEMO_STYLES = `
  .app-scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; background: var(--page-background); }
  .app-scroll::-webkit-scrollbar { display: none; }
  .app-body { min-height: 100%; box-sizing: border-box; }
  .demo-rise { animation: demo-rise .55s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes demo-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .demo-finger { position: absolute; z-index: 200; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; pointer-events: none;
    background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 18px rgba(0,0,0,.4);
    opacity: 0; transform: scale(1.25); transition: top .42s cubic-bezier(.2,.8,.2,1), opacity .25s ease, transform .18s ease; }
  .demo-finger.shown { opacity: 1; transform: scale(1); }
  .demo-finger.pressed { transform: scale(.78); background: rgba(255,255,255,.55); }
  .demo-pressed { filter: brightness(1.35); transform: scale(.96); transition: transform .12s ease, filter .12s ease; }
  .demo-spin { animation: demo-spin .8s linear infinite; }
  @keyframes demo-spin { to { transform: rotate(360deg); } }
  #page-todo .demo-done { --todo-color: #64748b; }
`;

const MONEY_ONLY = /^[+\-−]?\$[\d,]+(\.\d\d)?( \/ month)?$/;
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

function createScenePlayer(host, sceneName, appCss) {
  const root = host.attachShadow({ mode: "open" });
  root.innerHTML = `<style>${stylesForBox(appCss)}${DEMO_STYLES}</style><div class="app-scroll"><div class="app-body">${SCENE_HTML[sceneName.split("#")[0]]}</div></div>`;
  const scroller = root.querySelector(".app-scroll");
  const appBody = root.querySelector(".app-body");
  const byId = (id) => root.getElementById(id);
  const find = (selector) => root.querySelector(selector);
  const finger = document.createElement("div");
  finger.className = "demo-finger";
  scroller.appendChild(finger);
  let runId = 0;

  // The box is drawn smaller than the real app, so screen positions are divided by the current scale.
  const scale = () => host.getBoundingClientRect().width / APP_WIDTH || 1;
  const wait = (ms, id) => new Promise((resolve, reject) => setTimeout(() => (id === runId ? resolve() : reject("stopped")), ms));
  const positionInApp = (element) => {
    const box = element.getBoundingClientRect(), scrollerBox = scroller.getBoundingClientRect(), s = scale();
    return { left: (box.left - scrollerBox.left) / s, top: (box.top - scrollerBox.top) / s + scroller.scrollTop, width: box.width / s, height: box.height / s };
  };
  const topOf = (selector, offset = 76) => positionInApp(find(selector)).top - offset;
  const visiblePage = () => [...root.querySelectorAll('[id^="page-"]')].find((page) => !page.hidden && page.offsetParent !== null) || appBody;

  function smoothScrollTo(targetY, durationMs) {
    const startY = scroller.scrollTop;
    const endY = Math.max(0, Math.min(scroller.scrollHeight - scroller.clientHeight, targetY));
    const started = performance.now(), myRun = runId;
    return new Promise((resolve) => {
      function step(now) {
        if (myRun !== runId) return resolve();
        const progress = Math.min(1, (now - started) / durationMs);
        scroller.scrollTop = startY + (endY - startY) * easeInOut(progress);
        progress < 1 ? requestAnimationFrame(step) : resolve();
      }
      requestAnimationFrame(step);
    });
  }

  async function tap(element, id) {
    const spot = positionInApp(element);
    finger.style.transition = "none";
    finger.style.left = spot.left + spot.width / 2 + "px";
    finger.style.top = spot.top + spot.height / 2 + 60 + "px";
    finger.className = "demo-finger";
    await wait(30, id);
    finger.style.transition = "";
    finger.className = "demo-finger shown";
    finger.style.top = spot.top + spot.height / 2 + "px";
    await wait(420, id);
    finger.className = "demo-finger shown pressed";
    element.classList.add("demo-pressed");
    await wait(180, id);
    element.classList.remove("demo-pressed");
    finger.className = "demo-finger shown";
    await wait(250, id);
    finger.className = "demo-finger";
  }

  function countUp(element, durationMs) {
    const finalText = element.dataset.finalText || (element.dataset.finalText = element.textContent.trim());
    const match = finalText.match(/^([+\-−]?\$)([\d,]+(?:\.\d\d)?)(.*)$/);
    const finalNumber = parseFloat(match[2].replace(/,/g, ""));
    const hasCents = match[2].includes(".");
    const started = performance.now(), myRun = runId;
    function step(now) {
      if (myRun !== runId) { element.textContent = finalText; return; }
      const progress = Math.min(1, (now - started) / durationMs);
      const value = finalNumber * (1 - Math.pow(1 - progress, 3));
      element.textContent = match[1] + value.toLocaleString("en-US", { minimumFractionDigits: hasCents ? 2 : 0, maximumFractionDigits: hasCents ? 2 : 0 }) + match[3];
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function growBars(area) {
    for (const bar of area.querySelectorAll('[style*="width:"]')) {
      if (!/width:\s*[\d.]+%/.test(bar.getAttribute("style"))) continue;
      const finalWidth = bar.dataset.finalWidth || (bar.dataset.finalWidth = bar.style.width);
      bar.style.transition = "none";
      bar.style.width = "0%";
      void bar.offsetWidth;
      bar.style.transition = "width 1.1s cubic-bezier(.2,.8,.2,1) .35s";
      bar.style.width = finalWidth;
    }
  }
  function riseIn(area) {
    const tiles = [...area.querySelectorAll(".tile, h2, .legend")].filter((tile) => !tile.parentElement.closest(".tile"));
    tiles.forEach((tile, position) => {
      tile.classList.remove("demo-rise");
      void tile.offsetWidth;
      tile.style.animationDelay = Math.min(position, 10) * 70 + "ms";
      tile.classList.add("demo-rise");
    });
  }
  function introduce(area = visiblePage()) {
    riseIn(area);
    growBars(area);
    const bigMoney = [...area.querySelectorAll("div, b, span")].filter((element) => element.children.length === 0
      && MONEY_ONLY.test((element.dataset.finalText || element.textContent).trim()) && parseFloat(getComputedStyle(element).fontSize) >= 20);
    for (const element of bigMoney) countUp(element, 1200);
  }

  function drawChart() {
    const chart = find("#balance-chart svg");
    if (!chart) return;
    const line = chart.querySelector("polyline");
    const length = line.getTotalLength();
    const extras = chart.querySelectorAll("polygon, circle, text[style*='font-weight']");
    line.style.transition = "none";
    line.style.strokeDasharray = length;
    line.style.strokeDashoffset = length;
    extras.forEach((part) => { part.style.transition = "none"; part.style.opacity = 0; });
    void line.getBoundingClientRect();
    line.style.transition = "stroke-dashoffset 2.2s cubic-bezier(.45,.05,.3,1)";
    line.style.strokeDashoffset = 0;
    chart.querySelector("polygon").style.transition = "opacity 1s ease 1.2s";
    chart.querySelectorAll("circle, text[style*='font-weight']").forEach((part) => { part.style.transition = "opacity .5s ease 2.1s"; });
    extras.forEach((part) => { part.style.opacity = ""; });
  }

  async function typeInto(input, text, id) {
    input.value = "";
    input.classList.add("demo-typing");
    for (const character of text) { input.value += character; await wait(110, id); }
  }

  function showToast(text) {
    let toast = byId("toast");
    if (!toast) { toast = document.createElement("div"); toast.id = "toast"; root.appendChild(toast); } // fixed inside the box, like the real app
    toast.textContent = text;
    void toast.offsetWidth;
    toast.classList.add("toast-show");
  }

  // ---- One short script per screen ----
  const scripts = {
    async home(id) {
      introduce();
      await wait(3000, id);
      const refreshButton = byId("refresh-top-button");
      await tap(refreshButton, id);
      refreshButton.classList.add("demo-spin");
      byId("data-status").textContent = "Refreshing…";
      await wait(1100, id);
      refreshButton.classList.remove("demo-spin");
      byId("data-status").textContent = "Updated just now";
      showToast("Updated 9 items at 9:41 AM.");
      introduce(byId("balance-tiles"));
    },
    async "home#forecast"(id) {
      scroller.scrollTop = topOf("#balance-chart", 120);
      introduce(byId("balance-chart").parentElement);
      drawChart();
      await wait(3400, id);
      await smoothScrollTo(topOf("#calendar-list", 110), 1800);
    },
    async spending(id) {
      introduce();
      await wait(2600, id);
      await smoothScrollTo(topOf("#page-spending .tile:nth-of-type(6)", 80), 2600);
    },
    async cards(id) {
      introduce();
      await wait(2800, id);
      await smoothScrollTo(topOf("#page-rewards", 80), 2200);
    },
    async bills(id) {
      introduce();
      await wait(2600, id);
      await smoothScrollTo(scroller.scrollHeight, 3000);
    },
    async planner(id) {
      const result = byId("what-if-result");
      const label = byId("what-if-label"), amount = byId("what-if-amount"), date = byId("what-if-date");
      result.style.visibility = "hidden";
      label.value = ""; amount.value = ""; date.value = "";
      scroller.scrollTop = topOf("#what-if-form", 110);
      riseIn(byId("what-if-form").parentElement);
      await wait(700, id);
      await typeInto(label, "TV", id);
      await wait(150, id);
      await typeInto(amount, "800", id);
      await wait(150, id);
      date.value = "2026-12-05";
      await wait(400, id);
      await tap(byId("what-if-add-button"), id);
      label.value = ""; amount.value = "";
      result.style.visibility = "";
      introduce(result);
      await smoothScrollTo(topOf("#what-if-result", 120), 1000);
    },
    async goals(id) {
      introduce();
      await wait(2800, id);
      await smoothScrollTo(topOf("#expected-money-list", 140), 2000);
    },
    async todo(id) {
      root.querySelectorAll(".todo-ticking").forEach((tile) => tile.classList.remove("todo-ticking", "demo-done"));
      root.querySelectorAll(".swiped").forEach((row) => { row.classList.remove("swiped"); row.style.transform = ""; row.style.animation = ""; });
      introduce();
      await wait(1600, id);
      const firstCheck = find('[data-toggle-todo="0"]');
      await tap(firstCheck, id);
      firstCheck.closest(".todo-tile").classList.add("todo-ticking", "demo-done");
      await wait(1100, id);
      // Swipe left on the third task to show Delete.
      const row = find('[data-remove-todo="2"]').closest(".tile");
      if (!row.querySelector(".swipe-delete")) { row.classList.add("swipe-row"); const button = document.createElement("button"); button.className = "swipe-delete"; button.textContent = "Delete"; row.appendChild(button); }
      const spot = positionInApp(row);
      finger.style.transition = "none"; finger.style.left = spot.left + spot.width - 50 + "px"; finger.style.top = spot.top + spot.height / 2 + "px"; finger.className = "demo-finger shown";
      await wait(60, id);
      finger.style.transition = "left .5s ease"; finger.style.left = spot.left + spot.width - 160 + "px";
      row.classList.remove("demo-rise"); row.style.animation = "none";
      row.style.transition = "transform .5s ease"; row.style.transform = "translateX(-90px)"; row.classList.add("swiped");
      await wait(550, id);
      finger.className = "demo-finger";
    },
    async car(id) {
      introduce();
      await wait(2600, id);
      await smoothScrollTo(topOf("#car-summary .tile:nth-child(4)", 90), 1800);
    },
    async menu(id) {
      const menu = byId("side-menu"), overlay = byId("menu-overlay");
      menu.classList.remove("open"); overlay.hidden = true;
      introduce();
      await wait(900, id);
      await tap(byId("menu-button"), id);
      menu.classList.add("open"); overlay.hidden = false;
    },
    async lock(id) {
      const lockScreen = byId("lock-screen");
      const dots = [...root.querySelectorAll("#lock-dots span")];
      lockScreen.hidden = false; lockScreen.style.transition = "none"; lockScreen.style.opacity = 1;
      dots.forEach((dot) => dot.classList.remove("filled"));
      await wait(900, id);
      for (const [position, digit] of [4, 8, 1, 5].entries()) {
        const key = find(`#lock-pad [data-digit="${digit}"]`);
        key.classList.add("pressed");
        dots[position].classList.add("filled");
        await wait(160, id);
        key.classList.remove("pressed");
        await wait(240, id);
      }
      await wait(250, id);
      lockScreen.style.transition = "opacity .45s ease";
      lockScreen.style.opacity = 0;
      introduce();
    },
  };

  return {
    play() {
      runId++;
      const id = runId;
      byId("toast")?.classList.remove("toast-show");
      finger.className = "demo-finger";
      scroller.scrollTop = 0;
      (scripts[sceneName] || (async () => introduce()))(id).catch(() => {});
    },
    stop() { runId++; },
  };
}

</script>
<script>
// Each scene is a real app screen (captured with sample data) plus a short scripted demo inside it.
const SCENES = [
  { file: "home", icon: "🏠", color: "#5aa2ff", seconds: 7.5, title: "Your bank account's weather forecast", text: "Live balances, net worth and what's left to spend this month." },
  { file: "home#forecast", icon: "📈", color: "#5aa2ff", seconds: 7.5, title: "See 40 days ahead", text: "Every payday, bill and card payment, plotted day by day against your floor." },
  { file: "planner", icon: "🧮", color: "#fbbf24", seconds: 8, title: "“Can I afford it?” Answered.", text: "Try a purchase and see your lowest balance before you buy." },
  { file: "spending", icon: "🛒", color: "#fb923c", seconds: 7.5, title: "Know where it goes", text: "Every charge sorted by category, pending included, bills kept separate." },
  { file: "cards", icon: "💳", color: "#a78bfa", seconds: 7, title: "Closed vs open, on every card", text: "Due dates, utilization targets, room to spend, points and perks." },
  { file: "bills", icon: "🧾", color: "#fbbf24", seconds: 7.5, title: "Every bill in one place", text: "Subscriptions and expenses, matched to real charges automatically." },
  { file: "goals", icon: "🎯", color: "#f472b6", seconds: 7, title: "Save with a finish line", text: "Goals that follow your savings and tell you the weekly amount." },
  { file: "todo", icon: "✅", color: "#4ade80", seconds: 6.5, title: "Never miss a deadline", text: "Color-coded tasks. Tap to finish, swipe to delete." },
  { file: "car", icon: "🚗", color: "#2dd4bf", seconds: 6, title: "Pay off the car smarter", text: "Principal vs interest, payoff date and what extra payments save." },
  { file: "menu", icon: "☰", color: "#a78bfa", seconds: 5, title: "Everything, one swipe away", text: "Hide any tab you don't use. Set it all up in the app, no files needed." },
  { file: "lock", icon: "🔒", color: "#4ade80", seconds: 5, title: "Private by design", text: "PIN lock. Your numbers live only on your phone, never on a server." },
];

const framesBox = document.getElementById("app-frames");
const progressBox = document.getElementById("progress");
const featureList = document.getElementById("feature-list");
const captionTitle = document.getElementById("caption-title");
const captionText = document.getElementById("caption-text");
const pauseButton = document.getElementById("pause-button");
const viewer = document.getElementById("viewer");
const frames = [];
let currentScene = -1;
let advanceTimer = null;
let sceneStartedAt = 0;
let timeLeftMs = 0;
let isPaused = false;

// Leave empty to hide the GET button. Put the link you want to share here.
const GET_LINK = "guide.html";

// Scale the 393-pixel-wide app to the drawn phone screen.
function fitFrames() {
  const scale = framesBox.clientWidth / 393;
  for (const screen of frames) if (screen) screen.style.transform = `scale(${scale})`; // screens not built yet are skipped
}

function makeFrame(index) {
  if (frames[index]) return frames[index];
  const screen = document.createElement("div");
  screen.className = "app-screen";
  screen.setAttribute("aria-hidden", "true");
  framesBox.appendChild(screen);
  screen.player = createScenePlayer(screen, SCENES[index].file, APP_CSS);
  frames[index] = screen;
  fitFrames();
  return screen;
}

function restartAnimation(element) {
  element.classList.remove("fresh");
  void element.offsetWidth;
  element.classList.add("fresh");
}

function scheduleNext(ms) {
  clearTimeout(advanceTimer);
  sceneStartedAt = performance.now();
  timeLeftMs = ms;
  if (!isPaused) advanceTimer = setTimeout(() => showScene(currentScene + 1), ms);
}

function showScene(index) {
  currentScene = (index + SCENES.length) % SCENES.length;
  const scene = SCENES[currentScene];
  const frame = makeFrame(currentScene);
  makeFrame((currentScene + 1) % SCENES.length); // load the next one early
  frames.forEach((other) => { if (!other) return; other.classList.toggle("current", other === frame); if (other !== frame) other.player.stop(); });
  frame.player.play();

  captionTitle.textContent = scene.title;
  captionText.textContent = scene.text;
  restartAnimation(captionTitle);
  restartAnimation(captionText);
  document.body.style.setProperty("--glow", scene.color);

  [...progressBox.children].forEach((bar, position) => {
    bar.classList.remove("on", "done");
    if (position < currentScene) bar.classList.add("done");
  });
  void progressBox.offsetWidth;
  progressBox.children[currentScene].classList.add("on");
  [...featureList.children].forEach((row, position) => row.classList.toggle("on", position === currentScene));

  scheduleNext(scene.seconds * 1000);
}

function setPaused(shouldPause) {
  if (shouldPause === isPaused) return;
  isPaused = shouldPause;
  viewer.classList.toggle("paused", isPaused);
  pauseButton.textContent = isPaused ? "Play" : "Pause";
  if (isPaused) { clearTimeout(advanceTimer); timeLeftMs -= performance.now() - sceneStartedAt; }
  else scheduleNext(Math.max(400, timeLeftMs));
}

SCENES.forEach((scene, position) => {
  const bar = document.createElement("button");
  bar.style.setProperty("--duration", scene.seconds + "s");
  bar.setAttribute("aria-label", "Show: " + scene.title);
  bar.innerHTML = "<i></i>";
  bar.addEventListener("click", () => showScene(position));
  progressBox.appendChild(bar);

  const row = document.createElement("div");
  row.className = "feature";
  row.style.setProperty("--feature-color", scene.color);
  row.innerHTML = `<span class="feature-icon">${scene.icon}</span><div><b>${scene.title}</b><span>${scene.text}</span></div>`;
  row.addEventListener("click", () => { showScene(position); document.querySelector(".caption").scrollIntoView({ behavior: "smooth", block: "start" }); });
  featureList.appendChild(row);
});

document.getElementById("screen").addEventListener("click", (event) => {
  const box = event.currentTarget.getBoundingClientRect();
  showScene(currentScene + (event.clientX < box.left + box.width / 3 ? -1 : 1));
});
document.getElementById("previous-button").addEventListener("click", () => showScene(currentScene - 1));
document.getElementById("next-button").addEventListener("click", () => showScene(currentScene + 1));
pauseButton.addEventListener("click", () => setPaused(!isPaused));
document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight") showScene(currentScene + 1);
  if (event.key === "ArrowLeft") showScene(currentScene - 1);
  if (event.key === " ") { event.preventDefault(); setPaused(!isPaused); }
});
addEventListener("resize", fitFrames);
document.addEventListener("visibilitychange", () => { if (document.hidden) setPaused(true); });

const getButton = document.getElementById("get-button");
if (GET_LINK) { getButton.href = GET_LINK; getButton.hidden = false; }
showScene(0);
</script>
</body>
